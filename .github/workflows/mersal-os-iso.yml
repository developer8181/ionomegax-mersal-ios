name: Mersal OS ISO Build

on:
  push:
    paths:
      - "mersal-os/**"
      - "xtreme-ip-guard/**"
      - ".github/workflows/mersal-os-iso.yml"
    tags:
      - "mersal-os-*"
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container: debian:bookworm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Sync ISO screenshots
        run: |
          chmod +x mersal-os/scripts/sync-iso-screenshots.sh
          ./mersal-os/scripts/sync-iso-screenshots.sh || true

      - name: Build Mersal OS ISO
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap squashfs-tools xorriso isolinux syslinux-utils \
            rsync openssl ca-certificates sudo
          cd mersal-os
          chmod +x build/*.sh
          ./build/build-iso-debootstrap.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: mersal-os-iso
          path: |
            mersal-os/dist/*.iso
            mersal-os/dist/*.sha256
          retention-days: 30

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: mersal-os-screenshots-6.0
          path: |
            mersal-os/docs/screenshots/*.png
            xtreme-ip-guard/docs/screenshots/*.png
          retention-days: 90

  release-assets:
    needs: build-iso
    if: startsWith(github.ref, 'refs/tags/mersal-os-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mersal-os-iso
          path: dist-iso
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-iso/*
          generate_release_notes: true

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mersal OS core tests
        working-directory: mersal-os
        run: python3 -m unittest discover -s tests -v
      - name: Mersal Guard tests
        working-directory: xtreme-ip-guard
        run: python3 -m unittest discover -s tests -v
