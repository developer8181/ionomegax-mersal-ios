# Mersal HA-lite — PostgreSQL + PgBouncer connection pool (large endpoint fleets)
# Usage: docker compose -f deploy/docker-compose.ha.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mersal
      POSTGRES_PASSWORD: ${MERSAL_PG_PASSWORD:-change-me-ha}
      POSTGRES_DB: mersal
    volumes:
      - mersal_pg_primary:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mersal"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mersal:${MERSAL_PG_PASSWORD:-change-me-ha}@postgres:5432/mersal
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  mersal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      pgbouncer:
        condition: service_healthy
    ports:
      - "${MERSAL_PORT:-8090}:8090"
    environment:
      MERSAL_ENTERPRISE: "1"
      MERSAL_PRODUCTION: "1"
      MERSAL_AUTONOMOUS: "1"
      MERSAL_POSTGRES_DSN: postgresql://mersal:${MERSAL_PG_PASSWORD:-change-me-ha}@pgbouncer:5432/mersal
      MERSAL_SIGNING_SECRET: ${MERSAL_SIGNING_SECRET}
      MERSAL_UPDATE_SIGNING_KEY: ${MERSAL_UPDATE_SIGNING_KEY}
      MERSAL_API_TOKEN: ${MERSAL_API_TOKEN}
      MERSAL_ADMIN_PASSWORD: ${MERSAL_ADMIN_PASSWORD}
      MERSAL_REQUIRE_AGENT_KEYS: "1"
    volumes:
      - mersal_data:/app/data

volumes:
  mersal_pg_primary:
  mersal_data:
