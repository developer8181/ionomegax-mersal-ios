# Mersal Enterprise — bank/government profile (PostgreSQL + TLS + agent keys)
# Usage: docker compose -f deploy/docker-compose.enterprise.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mersal
      POSTGRES_PASSWORD: ${MERSAL_PG_PASSWORD:-change-me-in-production}
      POSTGRES_DB: mersal
    volumes:
      - mersal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mersal"]
      interval: 10s
      timeout: 5s
      retries: 5

  mersal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MERSAL_PORT:-8090}:8090"
    environment:
      MERSAL_ENTERPRISE: "1"
      MERSAL_PRODUCTION: "1"
      MERSAL_ENTERPRISE_STRICT: "1"
      MERSAL_POSTGRES_DSN: postgresql://mersal:${MERSAL_PG_PASSWORD:-change-me-in-production}@postgres:5432/mersal
      MERSAL_SIGNING_SECRET: ${MERSAL_SIGNING_SECRET}
      MERSAL_UPDATE_SIGNING_KEY: ${MERSAL_UPDATE_SIGNING_KEY}
      MERSAL_API_TOKEN: ${MERSAL_API_TOKEN}
      MERSAL_ADMIN_PASSWORD: ${MERSAL_ADMIN_PASSWORD}
      MERSAL_REQUIRE_AGENT_KEYS: "1"
      MERSAL_AUTONOMOUS: "1"
      MERSAL_TLS_CERT: /certs/server.crt
      MERSAL_TLS_KEY: /certs/server.key
      MERSAL_BACKUP_RETENTION_DAYS: "30"
    volumes:
      - mersal_data:/app/data
      - ${MERSAL_TLS_DIR:-./certs}:/certs:ro

volumes:
  mersal_pg_data:
  mersal_data:
