<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Mersal by Extreme Technology">
  <defs>
    <linearGradient id="extOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="mersalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="#ffffff" stroke="url(#mersalBlue)" stroke-width="2"/>
  <!-- Extreme swooshes (integrated above shield) -->
  <path d="M14 32 C38 14, 62 12, 88 26" fill="none" stroke="url(#extOrange)" stroke-width="5" stroke-linecap="round"/>
  <path d="M18 40 C42 24, 66 22, 92 34" fill="none" stroke="#cfd8dc" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M22 48 C46 32, 70 30, 96 42" fill="none" stroke="url(#extOrange)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Mersal security shield -->
  <g filter="url(#iconShadow)">
    <path d="M60 52 L78 72 H42 Z" fill="url(#mersalBlue)" opacity="0.2"/>
    <circle cx="60" cy="68" r="24" fill="url(#shieldFill)" stroke="url(#mersalBlue)" stroke-width="2.5"/>
    <path d="M50 68 L57 76 L72 58" stroke="url(#mersalBlue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="60" cy="92" r="3.5" fill="url(#extOrange)"/>
  </g>
</svg>
