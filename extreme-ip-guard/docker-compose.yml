version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: extreme-ipguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./data/extreme_ipguard.db
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://frontend
    volumes:
      - backend_data:/app/data
      - ml_models:/app/ml_models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ipguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: extreme-ipguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ipguard-net

volumes:
  backend_data:
  ml_models:

networks:
  ipguard-net:
    driver: bridge
