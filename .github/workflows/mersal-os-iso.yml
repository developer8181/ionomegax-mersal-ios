name: Mersal OS ISO Build

on:
  push:
    paths:
      - "mersal-os/**"
      - "xtreme-ip-guard/**"
      - ".github/workflows/mersal-os-iso.yml"
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container: debian:bookworm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build Mersal OS ISO
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap squashfs-tools xorriso isolinux syslinux-utils \
            rsync openssl ca-certificates sudo
          cd mersal-os
          chmod +x build/*.sh
          ./build/build-iso-debootstrap.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: mersal-os-iso
          path: |
            mersal-os/dist/*.iso
            mersal-os/dist/*.sha256
          retention-days: 30

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mersal OS core tests
        working-directory: mersal-os
        run: python3 -m unittest discover -s tests -v
      - name: Mersal Guard tests
        working-directory: xtreme-ip-guard
        run: python3 -m unittest discover -s tests -v
