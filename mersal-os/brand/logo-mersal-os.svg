<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Mersal OS">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="45%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Extreme-style motion swooshes -->
  <path d="M18 42 C70 8, 120 6, 168 28" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M28 58 C78 24, 128 20, 176 42" fill="none" stroke="#BDBDBD" stroke-width="7" stroke-linecap="round"/>
  <path d="M38 74 C86 42, 136 38, 184 58" fill="none" stroke="url(#orangeGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Shield / M mark -->
  <g filter="url(#softShadow)" transform="translate(24, 78)">
    <path d="M0 0 H72 L36 88 Z" fill="url(#shieldGrad)"/>
    <path d="M18 18 H54 L36 62 Z" fill="#FFFFFF" opacity="0.92"/>
    <text x="36" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#0F172A">M</text>
  </g>
  <!-- Wordmark -->
  <text x="120" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#orangeGrad)" transform="skewX(-8)">Mersal</text>
  <text x="122" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#616161">OS</text>
  <text x="122" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="url(#orangeGrad)" transform="skewX(-6)">Extreme</text>
  <text x="218" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="4" fill="#757575">TECHNOLOGY</text>
</svg>
