<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintCut - نظام التصميم والقص</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Top Menu Bar -->
        <header class="menu-bar">
            <div class="logo">
                <i class="fas fa-cut"></i>
                <span>PrintCut</span>
            </div>
            <nav class="main-menu">
                <div class="menu-item" data-menu="file">
                    <span>ملف</span>
                    <div class="dropdown-menu">
                        <button id="btn-new"><i class="fas fa-file"></i> مشروع جديد</button>
                        <button id="btn-open"><i class="fas fa-folder-open"></i> فتح مشروع</button>
                        <button id="btn-save"><i class="fas fa-save"></i> حفظ المشروع</button>
                        <hr>
                        <button id="btn-import-image"><i class="fas fa-image"></i> استيراد صورة</button>
                        <button id="btn-import-svg"><i class="fas fa-vector-square"></i> استيراد SVG</button>
                        <hr>
                        <button id="btn-export-png"><i class="fas fa-file-image"></i> تصدير PNG</button>
                        <button id="btn-export-svg"><i class="fas fa-file-code"></i> تصدير SVG</button>
                        <button id="btn-export-pdf"><i class="fas fa-file-pdf"></i> تصدير PDF</button>
                    </div>
                </div>
                <div class="menu-item" data-menu="edit">
                    <span>تحرير</span>
                    <div class="dropdown-menu">
                        <button id="btn-undo"><i class="fas fa-undo"></i> تراجع <kbd>Ctrl+Z</kbd></button>
                        <button id="btn-redo"><i class="fas fa-redo"></i> إعادة <kbd>Ctrl+Y</kbd></button>
                        <hr>
                        <button id="btn-copy"><i class="fas fa-copy"></i> نسخ <kbd>Ctrl+C</kbd></button>
                        <button id="btn-paste"><i class="fas fa-paste"></i> لصق <kbd>Ctrl+V</kbd></button>
                        <button id="btn-delete"><i class="fas fa-trash"></i> حذف <kbd>Del</kbd></button>
                        <hr>
                        <button id="btn-select-all"><i class="fas fa-object-group"></i> تحديد الكل <kbd>Ctrl+A</kbd></button>
                    </div>
                </div>
                <div class="menu-item" data-menu="view">
                    <span>عرض</span>
                    <div class="dropdown-menu">
                        <button id="btn-zoom-in"><i class="fas fa-search-plus"></i> تكبير</button>
                        <button id="btn-zoom-out"><i class="fas fa-search-minus"></i> تصغير</button>
                        <button id="btn-zoom-fit"><i class="fas fa-expand"></i> ملائمة</button>
                        <hr>
                        <button id="btn-toggle-grid"><i class="fas fa-th"></i> الشبكة</button>
                        <button id="btn-toggle-rulers"><i class="fas fa-ruler-combined"></i> المساطر</button>
                        <button id="btn-toggle-guides"><i class="fas fa-grip-lines"></i> خطوط الإرشاد</button>
                    </div>
                </div>
                <div class="menu-item" data-menu="object">
                    <span>كائن</span>
                    <div class="dropdown-menu">
                        <button id="btn-group"><i class="fas fa-object-group"></i> تجميع <kbd>Ctrl+G</kbd></button>
                        <button id="btn-ungroup"><i class="fas fa-object-ungroup"></i> فك التجميع</button>
                        <hr>
                        <button id="btn-bring-front"><i class="fas fa-layer-group"></i> أمام الكل</button>
                        <button id="btn-send-back"><i class="fas fa-layer-group"></i> خلف الكل</button>
                        <hr>
                        <button id="btn-align-left"><i class="fas fa-align-left"></i> محاذاة لليسار</button>
                        <button id="btn-align-center"><i class="fas fa-align-center"></i> محاذاة للوسط</button>
                        <button id="btn-align-right"><i class="fas fa-align-right"></i> محاذاة لليمين</button>
                    </div>
                </div>
                <div class="menu-item" data-menu="cut">
                    <span>قص</span>
                    <div class="dropdown-menu">
                        <button id="btn-cut-contour"><i class="fas fa-cut"></i> إنشاء خط قص</button>
                        <button id="btn-cut-offset"><i class="fas fa-expand-alt"></i> إزاحة خط القص</button>
                        <button id="btn-cut-preview"><i class="fas fa-eye"></i> معاينة القص</button>
                        <hr>
                        <button id="btn-send-to-cutter"><i class="fas fa-print"></i> إرسال للقاطع</button>
                    </div>
                </div>
            </nav>
            <div class="toolbar-actions">
                <button id="btn-print" class="action-btn" title="طباعة"><i class="fas fa-print"></i></button>
                <button id="btn-settings" class="action-btn" title="إعدادات"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Left Toolbar -->
            <aside class="toolbar-left">
                <div class="tool-group">
                    <button class="tool-btn active" data-tool="select" title="أداة التحديد (V)">
                        <i class="fas fa-mouse-pointer"></i>
                    </button>
                    <button class="tool-btn" data-tool="move" title="أداة التحريك (H)">
                        <i class="fas fa-hand-paper"></i>
                    </button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" data-tool="pen" title="أداة القلم (P)">
                        <i class="fas fa-pen"></i>
                    </button>
                    <button class="tool-btn" data-tool="pencil" title="الرسم الحر (B)">
                        <i class="fas fa-pencil-alt"></i>
                    </button>
                    <button class="tool-btn" data-tool="line" title="خط مستقيم (L)">
                        <i class="fas fa-minus"></i>
                    </button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" data-tool="rect" title="مستطيل (R)">
                        <i class="far fa-square"></i>
                    </button>
                    <button class="tool-btn" data-tool="circle" title="دائرة (C)">
                        <i class="far fa-circle"></i>
                    </button>
                    <button class="tool-btn" data-tool="polygon" title="مضلع">
                        <i class="fas fa-draw-polygon"></i>
                    </button>
                    <button class="tool-btn" data-tool="star" title="نجمة">
                        <i class="fas fa-star"></i>
                    </button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" data-tool="text" title="نص (T)">
                        <i class="fas fa-font"></i>
                    </button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" data-tool="image" title="صورة">
                        <i class="fas fa-image"></i>
                    </button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" data-tool="cut-path" title="مسار القص">
                        <i class="fas fa-cut"></i>
                    </button>
                    <button class="tool-btn" data-tool="contour" title="كنتور القص">
                        <i class="fas fa-vector-square"></i>
                    </button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" data-tool="eyedropper" title="قطارة اللون (I)">
                        <i class="fas fa-eye-dropper"></i>
                    </button>
                    <button class="tool-btn" data-tool="measure" title="أداة القياس">
                        <i class="fas fa-ruler"></i>
                    </button>
                </div>
            </aside>

            <!-- Canvas Area -->
            <main class="canvas-area">
                <div class="canvas-toolbar">
                    <div class="zoom-controls">
                        <button id="zoom-out-btn"><i class="fas fa-minus"></i></button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in-btn"><i class="fas fa-plus"></i></button>
                        <button id="zoom-fit-btn"><i class="fas fa-expand"></i></button>
                    </div>
                    <div class="canvas-size-info">
                        <span id="canvas-dimensions">210 × 297 mm</span>
                    </div>
                    <div class="snap-controls">
                        <label><input type="checkbox" id="snap-grid" checked> محاذاة للشبكة</label>
                        <label><input type="checkbox" id="snap-objects"> محاذاة للكائنات</label>
                    </div>
                </div>
                <div class="canvas-wrapper" id="canvas-wrapper">
                    <div class="ruler ruler-horizontal" id="ruler-h"></div>
                    <div class="ruler ruler-vertical" id="ruler-v"></div>
                    <div class="canvas-container" id="canvas-container">
                        <canvas id="main-canvas"></canvas>
                        <canvas id="overlay-canvas"></canvas>
                    </div>
                </div>
                <div class="status-bar">
                    <span id="status-position">X: 0 Y: 0</span>
                    <span id="status-selection">لا يوجد تحديد</span>
                    <span id="status-tool">أداة التحديد</span>
                </div>
            </main>

            <!-- Right Panel -->
            <aside class="panel-right">
                <!-- Properties Panel -->
                <div class="panel-section" id="properties-panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-sliders-h"></i> الخصائص</h3>
                        <button class="panel-toggle"><i class="fas fa-chevron-down"></i></button>
                    </div>
                    <div class="panel-body">
                        <div class="property-group">
                            <label>الموضع</label>
                            <div class="property-row">
                                <div class="property-field">
                                    <span>X</span>
                                    <input type="number" id="prop-x" value="0" step="0.1">
                                </div>
                                <div class="property-field">
                                    <span>Y</span>
                                    <input type="number" id="prop-y" value="0" step="0.1">
                                </div>
                            </div>
                        </div>
                        <div class="property-group">
                            <label>الحجم</label>
                            <div class="property-row">
                                <div class="property-field">
                                    <span>W</span>
                                    <input type="number" id="prop-w" value="0" step="0.1">
                                </div>
                                <div class="property-field">
                                    <span>H</span>
                                    <input type="number" id="prop-h" value="0" step="0.1">
                                </div>
                                <button id="lock-ratio" class="icon-btn" title="قفل النسبة"><i class="fas fa-lock"></i></button>
                            </div>
                        </div>
                        <div class="property-group">
                            <label>الدوران</label>
                            <div class="property-row">
                                <div class="property-field">
                                    <span>°</span>
                                    <input type="number" id="prop-rotation" value="0" step="1">
                                </div>
                            </div>
                        </div>
                        <div class="property-group">
                            <label>التعبئة</label>
                            <div class="property-row">
                                <input type="color" id="prop-fill" value="#ffffff">
                                <input type="range" id="prop-fill-opacity" min="0" max="100" value="100">
                                <span class="opacity-value">100%</span>
                            </div>
                        </div>
                        <div class="property-group">
                            <label>الحد</label>
                            <div class="property-row">
                                <input type="color" id="prop-stroke" value="#000000">
                                <input type="number" id="prop-stroke-width" value="1" min="0" step="0.5">
                                <select id="prop-stroke-style">
                                    <option value="solid">مستمر</option>
                                    <option value="dashed">متقطع</option>
                                    <option value="dotted">منقط</option>
                                </select>
                            </div>
                        </div>
                        <div class="property-group" id="text-properties" style="display:none;">
                            <label>خصائص النص</label>
                            <div class="property-row">
                                <select id="prop-font-family">
                                    <option value="Cairo">Cairo</option>
                                    <option value="Tajawal">Tajawal</option>
                                    <option value="Arial">Arial</option>
                                    <option value="Times New Roman">Times New Roman</option>
                                    <option value="Courier New">Courier New</option>
                                </select>
                            </div>
                            <div class="property-row">
                                <input type="number" id="prop-font-size" value="24" min="6" max="200">
                                <button class="icon-btn" id="prop-bold" title="عريض"><i class="fas fa-bold"></i></button>
                                <button class="icon-btn" id="prop-italic" title="مائل"><i class="fas fa-italic"></i></button>
                                <button class="icon-btn" id="prop-underline" title="تحته خط"><i class="fas fa-underline"></i></button>
                            </div>
                        </div>
                        <div class="property-group" id="cut-properties" style="display:none;">
                            <label>خصائص القص</label>
                            <div class="property-row">
                                <span>إزاحة القص</span>
                                <input type="number" id="prop-cut-offset" value="2" min="0" step="0.5"> mm
                            </div>
                            <div class="property-row">
                                <span>نوع الزوايا</span>
                                <select id="prop-cut-corners">
                                    <option value="round">مستديرة</option>
                                    <option value="miter">حادة</option>
                                    <option value="bevel">مشطوفة</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Layers Panel -->
                <div class="panel-section" id="layers-panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-layer-group"></i> الطبقات</h3>
                        <button class="panel-toggle"><i class="fas fa-chevron-down"></i></button>
                    </div>
                    <div class="panel-body">
                        <div class="layers-list" id="layers-list">
                        </div>
                        <div class="layers-actions">
                            <button id="add-layer" title="إضافة طبقة"><i class="fas fa-plus"></i></button>
                            <button id="delete-layer" title="حذف طبقة"><i class="fas fa-trash"></i></button>
                            <button id="duplicate-layer" title="تكرار طبقة"><i class="fas fa-copy"></i></button>
                            <button id="move-layer-up" title="تحريك لأعلى"><i class="fas fa-arrow-up"></i></button>
                            <button id="move-layer-down" title="تحريك لأسفل"><i class="fas fa-arrow-down"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Cut Settings Panel -->
                <div class="panel-section" id="cut-panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-cut"></i> إعدادات القص</h3>
                        <button class="panel-toggle"><i class="fas fa-chevron-down"></i></button>
                    </div>
                    <div class="panel-body">
                        <div class="property-group">
                            <label>نوع القص</label>
                            <select id="cut-type">
                                <option value="contour">كنتور حول التصميم</option>
                                <option value="shape">شكل محدد</option>
                                <option value="manual">يدوي</option>
                            </select>
                        </div>
                        <div class="property-group">
                            <label>المسافة من الحافة</label>
                            <input type="number" id="cut-margin" value="2" min="0" step="0.5"> mm
                        </div>
                        <div class="property-group">
                            <label>علامات التسجيل</label>
                            <label class="switch">
                                <input type="checkbox" id="reg-marks" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="property-group">
                            <button id="generate-cut-lines" class="btn-primary">
                                <i class="fas fa-magic"></i> إنشاء خطوط القص
                            </button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Modal: New Project -->
    <div class="modal" id="modal-new-project">
        <div class="modal-content">
            <div class="modal-header">
                <h2>مشروع جديد</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>اسم المشروع</label>
                    <input type="text" id="project-name" value="مشروع جديد">
                </div>
                <div class="form-group">
                    <label>حجم الصفحة</label>
                    <select id="page-size">
                        <option value="a4">A4 (210 × 297 mm)</option>
                        <option value="a3">A3 (297 × 420 mm)</option>
                        <option value="letter">Letter (216 × 279 mm)</option>
                        <option value="custom">مخصص</option>
                    </select>
                </div>
                <div class="form-group form-row" id="custom-size" style="display:none;">
                    <div>
                        <label>العرض (mm)</label>
                        <input type="number" id="custom-width" value="210">
                    </div>
                    <div>
                        <label>الارتفاع (mm)</label>
                        <input type="number" id="custom-height" value="297">
                    </div>
                </div>
                <div class="form-group">
                    <label>الاتجاه</label>
                    <div class="orientation-selector">
                        <button class="orientation-btn active" data-orientation="portrait">
                            <i class="fas fa-mobile-alt"></i> عمودي
                        </button>
                        <button class="orientation-btn" data-orientation="landscape">
                            <i class="fas fa-mobile-alt fa-rotate-90"></i> أفقي
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label>الدقة (DPI)</label>
                    <select id="project-dpi">
                        <option value="72">72 DPI (شاشة)</option>
                        <option value="150">150 DPI (متوسط)</option>
                        <option value="300" selected>300 DPI (طباعة)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancel-new-project">إلغاء</button>
                <button class="btn-primary" id="create-new-project">إنشاء</button>
            </div>
        </div>
    </div>

    <!-- Modal: Cut Preview -->
    <div class="modal" id="modal-cut-preview">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>معاينة القص</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <canvas id="cut-preview-canvas"></canvas>
                <div class="cut-preview-info">
                    <p>عدد خطوط القص: <span id="cut-lines-count">0</span></p>
                    <p>الطول الإجمالي: <span id="cut-total-length">0</span> mm</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary modal-close-btn">إغلاق</button>
                <button class="btn-primary" id="confirm-cut">إرسال للقاطع</button>
            </div>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="file-input-image" accept="image/*" style="display:none;">
    <input type="file" id="file-input-svg" accept=".svg" style="display:none;">
    <input type="file" id="file-input-project" accept=".printcut" style="display:none;">

    <script src="js/utils.js"></script>
    <script src="js/canvas-engine.js"></script>
    <script src="js/objects.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/cut-engine.js"></script>
    <script src="js/history.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
